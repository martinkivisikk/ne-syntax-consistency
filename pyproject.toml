[project]
name = "ne-syntax-consistency"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Martin Kivisikk", email = "martin.kivisikk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "conllu>=6.0.0",
    "estnltk==1.7.5",
    "gspan-mining>=0.2.3",
    "networkx>=3.7",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "tqdm>=4.70.1",
]

[project.scripts]
ne-syntax-consistency = "ne_syntax_consistency:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "marimo>=0.25.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
